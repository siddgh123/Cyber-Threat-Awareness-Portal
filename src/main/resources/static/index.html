<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTAP — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">🛡</span>
        <h1>CTAP</h1>
        <p>Cyber Threat Awareness Portal</p>
      </div>

      <!-- Alert -->
      <div class="cyber-alert error mb-3" id="login-alert"></div>

      <!-- Form -->
      <form id="login-form" novalidate>

        <div class="mb-3">
          <label class="form-label" for="login-email">Email Address</label>
          <input
            type="email"
            class="form-control cyber-input"
            id="login-email"
            placeholder="abcxyz@domain.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label" for="login-password">Password</label>
          <input
            type="password"
            class="form-control cyber-input"
            id="login-password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn-cyber" id="login-btn">
          ⚡ Access Portal
        </button>

      </form>

      <div class="cyber-divider"></div>

      <p class="text-center text-muted-c mono" style="font-size:0.82rem;">
        No account?
        <a href="register.html" style="color:var(--accent-blue);">Create one →</a>
      </p>

    </div>
  </div>

  <script src="Js/script.js"></script>
</body>
</html>
