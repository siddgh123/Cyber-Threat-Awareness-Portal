<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTAP — Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="register">

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <span class="logo-icon">🔐</span>
        <h1>Register</h1>
        <p>Create your CTAP agent account</p>
      </div>

      <!-- Alert -->
      <div class="cyber-alert error mb-3" id="reg-alert"></div>

      <!-- Form -->
      <form id="reg-form" novalidate>

        <div class="mb-3">
          <label class="form-label" for="reg-name">Full Name</label>
          <input
            type="text"
            class="form-control cyber-input"
            id="reg-name"
            placeholder="ABC XYZ"
            autocomplete="name"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="reg-email">Email Address</label>
          <input
            type="email"
            class="form-control cyber-input"
            id="reg-email"
            placeholder="abcxyz@gmail.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="reg-password">Password</label>
          <input
            type="password"
            class="form-control cyber-input"
            id="reg-password"
            placeholder="Min. 6 characters"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <input
            type="password"
            class="form-control cyber-input"
            id="reg-confirm"
            placeholder="Repeat password"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="btn-cyber" id="reg-btn">
          🚀 Create Account
        </button>

      </form>

      <div class="cyber-divider"></div>

      <p class="text-center text-muted-c mono" style="font-size:0.82rem;">
        Already have an account?
        <a href="index.html" style="color:var(--accent-blue);">Login →</a>
      </p>

    </div>
  </div>

  <script src="Js/script.js"></script>
</body>
</html>
